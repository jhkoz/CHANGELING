[SystemSettings]
; Texture streaming pool. The engine default of 1000 MB is sized for a 4-6 GB card;
; this machine has 16 GB of VRAM, and the pool being 1 GB is why the level reports
; being tens of GB over budget and textures load blurry.
;
; 6000 leaves roughly 9 GB for everything else -- Lumen, Nanite, shadow maps, render
; targets, and the editor's own allocations, which PIE doubles up on. Raise toward
; 8000 if "stat streaming" shows the pool still saturated AND nvidia-smi shows VRAM
; headroom to spare; back off if the editor starts hitching or crashing on load.
r.Streaming.PoolSize=6000

[CoreRedirects]
; Vendor packs moved from /Game/<Pack>/ into /Game/_Packages/<Pack>/ on DISK rather
; than in the editor, so no redirectors were generated and every hard reference into
; them would otherwise fail to resolve -- silently, as a missing material or a null
; mesh rather than an error. MixedVFX is the one that matters: the EldritchPrime
; flamethrower takes MI_Fire from it. The rest are listed because they cost nothing
; and the alternative is finding out months later.
;
; These can be removed once every referencing asset has been loaded and re-saved,
; which bakes the new path into the package.
+PackageRedirects=(OldName="/Game/MixedVFX/",NewName="/Game/_Packages/MixedVFX/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/NiagaraExamples/",NewName="/Game/_Packages/NiagaraExamples/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/FXVarietyPack/",NewName="/Game/_Packages/FXVarietyPack/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/RocketThrusterExhaustFX/",NewName="/Game/_Packages/RocketThrusterExhaustFX/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/GemstoneShaders/",NewName="/Game/_Packages/GemstoneShaders/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/Stone_Pack/",NewName="/Game/_Packages/Stone_Pack/",MatchSubstring=true)

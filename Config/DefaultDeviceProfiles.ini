; Texture LOD groups for CHANGELING.
;
; The level was reporting tens of GB over the streaming budget. An audit of all 4,148
; Texture2D assets found ~61 GB of texture data if fully resident, and the cause was
; purely source resolution:
;
;     8192px    351 textures  -> 26.6 GB  (42%)
;     4096px  1,651 textures  -> 29.6 GB  (47%)
;     2048px  1,093 textures  ->  5.7 GB   (9%)
;     <=1024   1,053 textures  ->  0.7 GB   (1%)
;
;   TEXTUREGROUP_World            3,191 textures -> 50.2 GB  (80%)
;   TEXTUREGROUP_WorldNormalMap     901 textures -> 11.4 GB  (18%)
;
; So 2,000 textures out of 4,148 hold 89% of the memory, and two groups hold 98%.
; Nothing is force-resident: only 102 textures have NeverStream, totalling 49.6 MB.
;
; MaxLODSize, NOT LODBias. A bias shifts EVERY texture in the group down a mip,
; including the 512px ones that were never the problem -- paying quality for no
; saving. MaxLODSize caps only what exceeds it: 8K and 4K resolve at 2K, while
; anything already at or below 2K is untouched.
;
; Effect: ~61 GB of potential texture data drops to roughly 12-14 GB, which a 6 GB
; streaming pool can actually work with. Ground and foliage read at a metre keep
; plenty of detail at 2K; this is only visible on a surface examined at arm's length.
;
; These lines are copied verbatim from the engine's BaseDeviceProfiles.ini with the
; single field changed, so filtering and mip generation stay at engine defaults.
;
; TO REVERT: delete this file, or set MaxLODSize back to 16384. Nothing here modifies
; a single asset -- no reimport, no resave, and it takes effect on the next launch.
; TO GO FURTHER: 1024 roughly quarters it again, at real cost to close-up surfaces.
; TO EXEMPT a hero asset: set its own Maximum Texture Size in the texture editor, or
; move it to a different LOD group; a per-asset setting wins over the group cap.

; NOTE the leading "+" on BOTH lines. Without it, the first entry REPLACES the whole
; TextureLODGroups array rather than adding to it -- which would silently discard the
; engine's definitions for Character, UI, Effects, Skybox and every other group, and
; leave the project with exactly two. "+" appends; a later entry for the same group
; overrides the earlier one, which is what we want.
[GlobalDefaults DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
